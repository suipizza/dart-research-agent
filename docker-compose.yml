services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: dart-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dart}
      POSTGRES_DB: ${POSTGRES_DB:-dart}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dart} -d ${POSTGRES_DB:-dart}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: dart-redis
    command: ["redis-server", "--appendonly", "yes"]  # 재시작해도 캐시·카운터 유지
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
