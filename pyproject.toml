[project]
name = "dart-research-agent"
version = "0.1.0"
description = "DART 공시 기반 리서치 에이전트: 원문 근거와 숫자 검증을 갖춘 LangGraph RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "lxml>=6.1.3",
    "anthropic>=2.10.0",
    "langgraph>=1.2.23",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "redis>=8.1.0",
    "langfuse>=5.2.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "pytest>=8.3",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
]
embed = [
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",  # 아래 [tool.uv.sources]로 리눅스에서는 CPU 휠을 쓰기 위해 직접 명시
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: 기본 오류, I: import 정렬, B: 흔한 버그 패턴, UP: 최신 문법, SIM: 단순화
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 실제 DB나 외부 API가 필요한 테스트 (CI 기본 실행에서 제외)",
]
addopts = "-m 'not integration'"

[tool.uv]
# 로컬 `uv sync`는 임베딩 모델까지 설치. CI는 --no-group embed로 PyTorch를 건너뛴다.
default-groups = ["dev", "embed"]

[tool.ruff.lint.per-file-ignores]
# 프롬프트 문장은 줄 길이 제한에서 제외 (문장을 억지로 자르면 프롬프트 가독성이 떨어진다)
"app/rag/answer.py" = ["E501"]
"eval/judge.py" = ["E501"]
"app/agent/*.py" = ["E501"]
"app/api/*.py" = ["E501"]

# Docker(리눅스) 이미지에서는 CPU 전용 PyTorch를 쓴다. 기본 휠은 CUDA 포함이라 수 GB가 더 크다.
# 맥은 그대로 PyPI 휠(MPS 지원).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
