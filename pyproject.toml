[project]
name = "dart-research-agent"
version = "0.1.0"
description = "DART 공시 기반 리서치 에이전트: 원문 근거와 숫자 검증을 갖춘 LangGraph RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: 기본 오류, I: import 정렬, B: 흔한 버그 패턴, UP: 최신 문법, SIM: 단순화
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 실제 DB나 외부 API가 필요한 테스트 (CI 기본 실행에서 제외)",
]
addopts = "-m 'not integration'"
